name: Import TrailCircle Source
on:
  push:
    branches: [main]
    paths:
      - 'trailcircle/source.tar.xz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and unpack source snapshot
        run: |
          python - <<'PY'
          import base64, hashlib, io, tarfile
          from pathlib import Path
          encoded = Path("trailcircle/source.tar.xz.b64").read_text().strip()
          archive = base64.b64decode(encoded, validate=True)
          expected = "214418cae768dcb8555f8e528c892d5511d39f844a71568f21004b0f8469ac5c"
          assert hashlib.sha256(archive).hexdigest() == expected, "Source archive integrity check failed"
          allowed = {"server.py", "static/app.js", "static/style.css", "static/index.html", "static/manifest.json"}
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:xz") as tar:
              names = {m.name for m in tar.getmembers()}
              assert names == allowed, f"Unexpected source paths: {names}"
              for member in tar.getmembers():
                  assert member.isfile(), "Unexpected non-file in archive"
                  data = tar.extractfile(member).read()
                  dest = Path("trailcircle") / member.name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(data)
          print("Imported all five TrailCircle application source files")
          PY
      - name: Commit imported source and remove staging parts
        run: |
          rm -rf trailcircle/_source-parts
          git add -A trailcircle/
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git -c user.name="trailcircle-import-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Import reviewed TrailCircle v1.1 source"
            git push origin HEAD:main
          fi
