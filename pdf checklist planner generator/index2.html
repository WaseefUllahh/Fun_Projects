<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blank Daily Checklist Generator</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f6f8fa;display:flex;justify-content:center;align-items:center;height:100vh}
    .card{background:#fff;padding:32px 40px;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.12);width:320px}
    h2{margin-top:0}
    label{display:block;margin:16px 0 4px;font-weight:600}
    input[type=date]{width:100%;padding:8px;font-size:15px}
    button{margin-top:24px;width:100%;padding:10px;font-size:16px;cursor:pointer}
    .note{font-size:13px;color:#555;margin-top:8px}
  </style>
</head>
<body>
  <div class="card">
    <h2>Blank Daily Checklist</h2>
    <label>From <input id="from" type="date"></label>
    <label>To   <input id="to"   type="date"></label>
    <button onclick="generate()">Create PDF</button>
    <div class="note">Generates one blank row per day.<br>Print & fill by hand.</div>
  </div>

  <!-- CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<script>
  function generate() {
    const fromStr = document.getElementById('from').value;
    const toStr   = document.getElementById('to').value;

    if (!fromStr || !toStr) {
      alert("Pick both dates");
      return;
    }

    const rows = [];
    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    // Parse as local dates (avoids timezone shift)
    let d = new Date(`${fromStr}T00:00`);
    const end = new Date(`${toStr}T00:00`);

    while (d <= end) {
      rows.push([
        d.toLocaleDateString('en-CA'), // formatted date
        dayNames[d.getDay()],          // weekday name
        '',                            // Task
        ''                             // Notes
      ]);
      d.setDate(d.getDate() + 1); // ✅ safely move forward 1 day
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'p', unit: 'pt', format: 'a4' });

    doc.setFontSize(16);
    doc.text(`Daily Checklist  ${fromStr} → ${toStr}`, 40, 40);

    doc.autoTable({
      head: [['Date','Day','Task','Notes']],
      body: rows,
      startY: 65,
      theme: 'grid',
      styles: { fontSize: 10, cellPadding: 4, minCellHeight: 18 },
      headStyles: { fillColor: [66,139,202], textColor: 255, fontStyle: 'bold' },
      tableWidth: 515,
      columnStyles: {
        0: { cellWidth: 80 },
        1: { cellWidth: 35 },
        2: { cellWidth: 200 },
        3: { cellWidth: 200 }
      }
    });

    doc.save(`Checklist_${fromStr}_to_${toStr}.pdf`);
  }
</script>
</body>
</html>
